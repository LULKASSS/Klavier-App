<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klavier verbinden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#EDEDF0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDF0; background: radial-gradient(ellipse 900px 440px at 12% 108%, rgba(255,77,125,.11), transparent 70%), radial-gradient(ellipse 900px 440px at 88% 108%, rgba(255,225,77,.075), transparent 70%), radial-gradient(ellipse 1300px 520px at 50% -25%, rgba(255,77,125,.045), transparent 70%), #050507">
  <div style="width: 560px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em">Klavier verbinden</h1>
      <span style="font-size: 14px; color: rgba(237,237,240,.6)">Einmalig. Danach erkennt die App dein FP-30X von selbst.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04)">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(61,182,122,.18); color: #3DB67A; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>
        </span>
        <span style="flex: 1; font-size: 14.5px">USB-Kabel vom Klavier an den Mac</span>
        <span style="font-size: 12.5px; color: rgba(237,237,240,.55)">USB-B auf USB-C</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.04)">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(61,182,122,.18); color: #3DB67A; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>
        </span>
        <span style="flex: 1; font-size: 14.5px">Chrome den Zugriff auf MIDI erlauben</span>
        <span style="font-size: 12.5px; color: rgba(237,237,240,.55)">erlaubt</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,225,77,.35)">
        <div style="display: flex; align-items: center; gap: 14px">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFE14D; color: #050507; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none">3</span>
          <span style="flex: 1; font-size: 14.5px; font-weight: 500">Drück irgendeine Taste</span>
          <span style="font-size: 12.5px; color: #FFE14D">C4 erkannt</span>
        </div>
        <div style="position: relative; height: 70px; border-radius: 8px; overflow: hidden; background: #0A0A0C">
          <sc-for list="{{whites}}" as="k" hint-placeholder-count="15"><div style="{{k}}"></div></sc-for>
          <sc-for list="{{blacks}}" as="k" hint-placeholder-count="10"><div style="{{k}}"></div></sc-for>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: rgba(237,237,240,.65)">
          <span>Ton kommt aus dem Klavier</span>
          <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.08); color: #FFFFFF">Testton spielen</button>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <button style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 13.5px; background: transparent; color: rgba(237,237,240,.6)">Ohne Klavier weiter</button>
      <a href="Bibliothek.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: #050507; font-size: 14.5px; font-weight: 600; text-decoration: none">Fertig</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const isW = (m) => [0,2,4,5,7,9,11].indexOf(m % 12) >= 0;
    const lo = 53, hi = 77, W = 528, KH = 70;
    const wh = []; for (let m = lo; m <= hi; m++) if (isW(m)) wh.push(m);
    const ww = W / wh.length; const pos = {};
    wh.forEach((m, i) => { pos[m] = {x: i * ww, w: ww, white: true}; });
    for (let m = lo; m <= hi; m++) if (!isW(m) && pos[m-1]) { const b = ww * .58; pos[m] = {x: pos[m-1].x + ww - b / 2, w: b, white: false}; }
    const whites = [], blacks = [];
    for (let m = lo; m <= hi; m++) { const k = pos[m]; if (!k) continue; const on = m === 60;
      if (k.white) whites.push(`position:absolute;left:${(k.x + .5).toFixed(1)}px;top:0;width:${(k.w - 1).toFixed(1)}px;height:${KH}px;border-radius:0 0 4px 4px;background:${on ? 'linear-gradient(180deg,#FFFFFF,#FFE14D 35%,rgba(255,225,77,.75))' : 'linear-gradient(180deg,#BFC0C8 0%,#ECECF0 40%,#DCDCE2 100%)'};${on ? 'box-shadow:0 0 18px rgba(255,225,77,.6);' : ''}`);
      else blacks.push(`position:absolute;left:${k.x.toFixed(1)}px;top:0;width:${k.w.toFixed(1)}px;height:${Math.round(KH * .6)}px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#26262C 0%,#101013 85%,#2E2E35 100%);`);
    }
    return {whites, blacks};
  }
}
</script>
</body>
</html>
