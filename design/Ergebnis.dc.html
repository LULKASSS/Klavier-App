<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ergebnis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#EDEDF0}a:hover{color:#FFFFFF}
@keyframes kt-grow{0%{transform:scaleY(.2);opacity:0}100%{transform:scaleY(1);opacity:1}}
@keyframes kt-rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #EDEDF0; background: radial-gradient(ellipse 900px 440px at 12% 108%, rgba(255,77,125,.11), transparent 70%), radial-gradient(ellipse 900px 440px at 88% 108%, rgba(255,225,77,.075), transparent 70%), radial-gradient(ellipse 1300px 520px at 50% -25%, rgba(255,77,125,.045), transparent 70%), #050507">

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 680px; box-sizing: border-box; padding: 30px 32px; border-radius: 26px; background: rgba(16,16,20,.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 30px 80px -30px rgba(0,0,0,.9); display: flex; flex-direction: column; gap: 22px">
    <span style="font-size: 13px; color: rgba(237,237,240,.55)">Glatteis · Teil 3 · Takt 9 – 12½ · Runde 14</span>

    <div style="display: flex; align-items: flex-end; gap: 18px; animation: kt-rise .6s cubic-bezier(.22,1,.36,1) both">
      <span style="font-size: 88px; font-weight: 600; line-height: .9; letter-spacing: -0.04em">86<span style="font-size: 44px">%</span></span>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px">
        <span style="font-size: 14px; font-weight: 500">getroffen</span>
        <span style="font-size: 13px; color: #3DB67A">+12 % seit Runde 1</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: flex-end; gap: 4px; height: 80px">
        <sc-for list="{{noteBars}}" as="b" hint-placeholder-count="23"><div style="{{b}}"></div></sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: rgba(237,237,240,.5)">
        <span>Takt 9</span><span>10</span><span style="color: #FF6B8F">11 · hier hakt es</span><span>12</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: rgba(237,237,240,.55)">Tempo</span><span style="font-size: 16px; font-weight: 600">70 → 85 %</span></div>
      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: rgba(237,237,240,.55)">Geübt</span><span style="font-size: 16px; font-weight: 600">6 Min.</span></div>
      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: rgba(237,237,240,.55)">Sicher im Song</span><span style="font-size: 16px; font-weight: 600">10 / 32 Takte</span></div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Uebungsplan.dc.html" style="display: inline-flex; align-items: center; height: 42px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; color: rgba(237,237,240,.7); text-decoration: none">Übungsplan</a>
      <div style="flex: 1"></div>
      <a href="Schleife.dc.html" style="display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 999px; background: rgba(255,77,125,.14); color: #FF8AA6; font-size: 13.5px; font-weight: 600; text-decoration: none">Nur Takt 11 üben</a>
      <a href="Ueben.dc.html" style="display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 999px; background: rgba(255,255,255,.08); color: #FFFFFF; font-size: 13.5px; font-weight: 600; text-decoration: none">Weiterspielen</a>
      <a href="Ueben.dc.html" style="display: inline-flex; align-items: center; height: 42px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: #050507; font-size: 14px; font-weight: 600; text-decoration: none">Nochmal</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const vals = [96,100,90,94,100,88,92,98, 82,90,96,100,74, 52,60,48,70,64, 92,96,100,94,98];
    const noteBars = vals.map((v, i) => {
      const bad = v < 72; const ok = v >= 90;
      const bg = bad ? 'linear-gradient(180deg,#FF4D7D,rgba(255,77,125,.35))' : (ok ? 'linear-gradient(180deg,#3DB67A,rgba(61,182,122,.3))' : 'repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,rgba(255,255,255,.12) 3px 6px)');
      return `flex:1;height:${Math.round(v * .78)}px;border-radius:4px 4px 2px 2px;background:${bg};transform-origin:bottom;animation:kt-grow .5s cubic-bezier(.22,1,.36,1) ${(i * .03).toFixed(2)}s both;`;
    });
    return {noteBars};
  }
}
</script>
</body>
</html>
