<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einstellungen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#EDEDF0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 32px; display: flex; gap: 40px; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #EDEDF0; background: radial-gradient(ellipse 900px 440px at 12% 108%, rgba(255,77,125,.11), transparent 70%), radial-gradient(ellipse 900px 440px at 88% 108%, rgba(255,225,77,.075), transparent 70%), radial-gradient(ellipse 1300px 520px at 50% -25%, rgba(255,77,125,.045), transparent 70%), #050507">

  <div style="width: 200px; flex: none; display: flex; flex-direction: column; gap: 4px">
    <a href="Bibliothek.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; margin-bottom: 18px; border-radius: 999px; background: rgba(255,255,255,.06); color: rgba(237,237,240,.75); font-size: 13px; text-decoration: none">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg>Bibliothek
    </a>
    <a href="#klavier" style="height: 36px; padding: 0 12px; border-radius: 10px; background: rgba(255,255,255,.08); color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Klavier</a>
    <a href="#klang" style="height: 36px; padding: 0 12px; border-radius: 10px; color: rgba(237,237,240,.7); font-size: 14px; display: flex; align-items: center; text-decoration: none">Klang</a>
    <a href="#darstellung" style="height: 36px; padding: 0 12px; border-radius: 10px; color: rgba(237,237,240,.7); font-size: 14px; display: flex; align-items: center; text-decoration: none">Darstellung</a>
    <a href="#umwandlung" style="height: 36px; padding: 0 12px; border-radius: 10px; color: rgba(237,237,240,.7); font-size: 14px; display: flex; align-items: center; text-decoration: none">Umwandlung</a>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-content: start">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div id="{{g.id}}" style="padding: 18px 20px; border-radius: 20px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 600; margin-bottom: 6px">{{g.title}}</span>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; border-top: 1px solid rgba(255,255,255,.05)">
            <span style="font-size: 13.5px; color: rgba(237,237,240,.8)">{{r.label}}</span>
            <sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{false}}">
              <button role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" style="{{r.sw}}"><span style="{{r.knob}}"></span></button>
            </sc-if>
            <sc-if value="{{r.isValue}}" hint-placeholder-val="{{false}}">
              <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: rgba(255,255,255,.06); color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.value}}
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4l3 3 3-3"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{r.isSwatch}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 6px">
                <sc-for list="{{r.swatches}}" as="s" hint-placeholder-count="4"><button aria-label="{{s.name}}" style="{{s.style}}"></button></sc-for>
              </div>
            </sc-if>
            <sc-if value="{{r.isSlider}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 10px; width: 200px">
                <div style="position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1)"><div style="{{r.fill}}"></div><div style="{{r.thumb}}"></div></div>
                <span style="font-size: 13px; font-weight: 600; min-width: 42px; text-align: right">{{r.value}}</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const sw = (on) => ({isSwitch: true, on: on ? 'true' : 'false', sw: `border:0;padding:0;width:40px;height:24px;border-radius:999px;position:relative;flex:none;background:${on ? '#3DB67A' : 'rgba(255,255,255,.14)'};`, knob: `position:absolute;${on ? 'right' : 'left'}:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;`});
    const val = (v) => ({isValue: true, value: v});
    const sl = (p, v) => ({isSlider: true, value: v, fill: `width:${p}%;height:4px;border-radius:2px;background:#FFFFFF;`, thumb: `position:absolute;left:${p}%;top:-7px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#FFFFFF;`});
    const swatch = (list, sel) => ({isSwatch: true, swatches: list.map(([name, c]) => ({name, style: `width:28px;height:28px;border:0;border-radius:50%;background:${c};box-shadow:${name === sel ? `0 0 0 2px #050507, 0 0 0 4px ${c}, 0 0 14px ${c}` : `0 0 8px ${c}55`};`}))});
    const groups = [
      {id: 'klavier', title: 'Klavier', rows: [
        Object.assign({label: 'Eingang'}, val('Roland Digital Piano')),
        Object.assign({label: 'Ausgang'}, val('Roland Digital Piano')),
        Object.assign({label: 'Ton über das Klavier'}, sw(true)),
        Object.assign({label: 'Verzögerung ausgleichen'}, sl(24, '12 ms'))]},
      {id: 'klang', title: 'Klang', rows: [
        Object.assign({label: 'Band leise dazu'}, sw(true)),
        Object.assign({label: 'Gesang'}, sl(20, '20 %')),
        Object.assign({label: 'Schlagzeug'}, sl(40, '40 %')),
        Object.assign({label: 'Bass'}, sl(35, '35 %')),
        Object.assign({label: 'Metronom'}, sw(false))]},
      {id: 'darstellung', title: 'Darstellung', rows: [
        Object.assign({label: 'Linke Hand'}, swatch([['Pink','#FF4D7D'],['Rosa','#FF7AB6'],['Orange','#FFB347'],['Flieder','#B79CFF']], 'Pink')),
        Object.assign({label: 'Rechte Hand'}, swatch([['Gelb','#FFE14D'],['Orange','#FFB347'],['Flieder','#B79CFF'],['Rosa','#FF7AB6']], 'Gelb')),
        Object.assign({label: 'Füllung der Noten'}, sl(45, '45 %')),
        Object.assign({label: 'Funken'}, sl(50, 'mittel')),
        Object.assign({label: 'Leiste beim Spielen ausblenden'}, sw(true))]},
      {id: 'umwandlung', title: 'Umwandlung', rows: [
        Object.assign({label: 'Erkennung'}, val('Genau · Klavier-Modell')),
        Object.assign({label: 'Stimmen vorher trennen'}, sw(true)),
        Object.assign({label: 'Fassungen bauen'}, val('Leicht, Mittel, Original')),
        Object.assign({label: 'Notenblatt beim Start'}, sw(false))]}
    ];
    return {groups};
  }
}
</script>
</body>
</html>
