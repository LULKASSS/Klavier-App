<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#EDEDF0}a:hover{color:#FFFFFF}
@keyframes kt-fall{0%{transform:translateY(-140px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(770px);opacity:0}}
@keyframes kt-rise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes kt-breathe{0%,100%{opacity:.35}50%{opacity:.6}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDF0; background: radial-gradient(ellipse 900px 500px at 50% 95%, rgba(255,77,125,.10), transparent 70%), radial-gradient(ellipse 700px 420px at 72% 90%, rgba(255,225,77,.08), transparent 70%), #050507">

  <div style="position: absolute; left: 0; top: 0; width: 1280px; height: 630px; overflow: hidden">
    <sc-for list="{{drops}}" as="d" hint-placeholder-count="14"><div style="{{d}}"></div></sc-for>
  </div>

  <div style="position: absolute; left: 0; top: 614px; width: 1280px; height: 28px; background: linear-gradient(90deg, #FF4D7D 0%, #FF4D7D 38%, #FFE14D 62%, #FFE14D 100%); filter: blur(12px); animation: kt-breathe 3.2s ease-in-out infinite"></div>
  <div style="position: absolute; left: 0; top: 628px; width: 1280px; height: 3px; background: linear-gradient(90deg, #FF4D7D 0%, #FF4D7D 38%, #FFE14D 62%, #FFE14D 100%); box-shadow: 0 0 10px rgba(255,255,255,.35)"></div>

  <div style="position: absolute; left: 0; top: 630px; width: 1280px; height: 170px; background: #0A0A0C">
    <sc-for list="{{whites}}" as="k" hint-placeholder-count="52"><div style="{{k}}"></div></sc-for>
    <sc-for list="{{blacks}}" as="k" hint-placeholder-count="36"><div style="{{k}}"></div></sc-for>
  </div>

  <div style="position: absolute; left: 0; top: 0; width: 1280px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(ellipse 520px 260px at 50% 50%, rgba(5,5,7,.85), transparent 75%)">
    <h1 style="margin: 0; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; animation: kt-rise .9s cubic-bezier(.22,1,.36,1) .3s both">Bereit?</h1>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: rgba(237,237,240,.7); animation: kt-rise .9s cubic-bezier(.22,1,.36,1) .55s both">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #3DB67A; box-shadow: 0 0 8px rgba(61,182,122,.8)"></span>
      FP-30X verbunden
    </div>
    <a href="Zuhause.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 26px; border-radius: 999px; background: #FFFFFF; color: #050507; font-size: 15px; font-weight: 600; text-decoration: none; animation: kt-rise .9s cubic-bezier(.22,1,.36,1) .8s both">Los geht's</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
  renderVals() {
    const R = '#FFE14D', Lc = '#FF4D7D';
    const W = 1280, KH = 170, lo = 21, hi = 108;
    const isW = (m) => [0,2,4,5,7,9,11].indexOf(m % 12) >= 0;
    const wh = []; for (let m = lo; m <= hi; m++) if (isW(m)) wh.push(m);
    const ww = W / wh.length; const pos = {};
    wh.forEach((m, i) => { pos[m] = {x: i * ww, w: ww, white: true}; });
    for (let m = lo; m <= hi; m++) if (!isW(m)) { const b = ww * .58; pos[m] = {x: pos[m-1].x + ww - b / 2, w: b, white: false}; }
    const seq = [[45,0,140,'l'],[52,.4,90,'l'],[64,.8,60,'r'],[67,1.3,60,'r'],[69,1.8,90,'r'],[72,2.4,120,'r'],[40,2.9,140,'l'],[76,3.3,30,'r'],[79,3.6,30,'r'],[71,4.1,60,'r'],[48,4.5,120,'l'],[84,5,30,'r'],[69,5.4,90,'r'],[41,5.9,140,'l']];
    const drops = seq.map(([m, d, h, hand]) => {
      const k = pos[m]; const c = hand === 'r' ? R : Lc; const pad = k.white ? 4 : 2; const w = k.w - 2 * pad;
      return `position:absolute;box-sizing:border-box;left:${(k.x + pad).toFixed(1)}px;top:0;width:${w.toFixed(1)}px;height:${h}px;border-radius:${Math.min(6, w / 3).toFixed(1)}px;background:linear-gradient(180deg,${this.rgba(c,.16)},${this.rgba(c,.45)});border:2px solid ${c};box-shadow:0 0 6px ${this.rgba(c,.9)},0 0 18px ${this.rgba(c,.45)};animation:kt-fall 6.4s linear ${d}s infinite;`;
    });
    const whites = [], blacks = [];
    for (let m = lo; m <= hi; m++) {
      const k = pos[m];
      if (k.white) whites.push(`position:absolute;left:${(k.x + .5).toFixed(1)}px;top:0;width:${(k.w - 1).toFixed(1)}px;height:${KH - 3}px;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#BFC0C8 0%,#ECECF0 40%,#DCDCE2 100%);`);
      else blacks.push(`position:absolute;left:${k.x.toFixed(1)}px;top:0;width:${k.w.toFixed(1)}px;height:${Math.round(KH * .6)}px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#26262C 0%,#101013 85%,#2E2E35 100%);box-shadow:0 2px 3px rgba(0,0,0,.5);`);
    }
    return {drops, whites, blacks};
  }
}
</script>
</body>
</html>
